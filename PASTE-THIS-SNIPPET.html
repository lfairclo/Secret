<!-- =========================================================================
     PASTE THIS BLOCK NEAR THE TOP OF <body> ON ANY PAGE YOU WANT PROTECTED.
     It's fully self-contained — no shared file to host elsewhere, so it
     works the same regardless of which repo/site the page lives in.

     It checks three things, in this order, and redirects to secret.html
     (carrying a ?redirect= back to this page) if any of the first two fail,
     or to sorry.html if the time check fails:
       1. Is there a fresh (<1hr old) password-entry cookie?
       2. Are they signed in with Google (Firebase Auth)?
       3. Is it currently an allowed time?
     If all three pass, this does nothing further — the rest of your page
     just runs normally underneath it.

     HONEST LIMITS: the cookie, the auth state, and the clock are all
     things running in the visitor's own browser, so a technical user could
     fake or change any of them. This stops casual playing during lessons;
     it isn't real security. Also: Firebase Auth itself depends on Google's
     servers being reachable — if your school's filter ever blocks Google's
     own auth domains (not just random raw-file hosts, which is what
     tripped things up before), sign-in itself won't work and there's no
     way around that from here.
     ========================================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function () {
  // ---- Same Firebase project/config as secret.html ----
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const LOGIN_URL = 'https://lfairclo.github.io/Secret/secret.html';
  const COOKIE_NAME = 'ss_pw_token';
  const VALID_MS = 60 * 60 * 1000; // 1 hour

  // Edit these to change the allowed windows (weekends are unrestricted).
  const ALLOWED_WINDOWS = [
    [0, 8 * 60 + 45],              // before 8:45
    [16 * 60, 24 * 60],            // after 16:00
    [10 * 60 + 15, 10 * 60 + 35],  // 10:15 - 10:35 (break)
    [12 * 60 + 50, 14 * 60 + 5],   // 12:50 - 14:05 (lunch)
  ];

  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return m ? decodeURIComponent(m[2]) : null;
  }
  function hasValidPasswordToken() {
    const raw = getCookie(COOKIE_NAME);
    if (!raw) return false;
    const t = parseInt(raw, 10);
    return !!t && (Date.now() - t) < VALID_MS;
  }
  function isWithinAllowedWindow(date) {
    date = date || new Date();
    const day = date.getDay(); // 0 = Sunday, 6 = Saturday
    if (day === 0 || day === 6) return true;
    const mins = date.getHours() * 60 + date.getMinutes();
    return ALLOWED_WINDOWS.some(function (w) { return mins >= w[0] && mins < w[1]; });
  }
  function sendToLogin() {
    window.location.replace(LOGIN_URL + '?redirect=' + encodeURIComponent(location.href));
  }

  // 1 & 3 can be checked immediately (no async needed).
  if (!isWithinAllowedWindow()) {
    window.location.replace('sorry.html');
    return;
  }
  if (!hasValidPasswordToken()) {
    sendToLogin();
    return;
  }

  // 2. Auth state — Firebase resolves this from its own persisted session,
  // so this re-checks fresh on every load rather than trusting a flag.
  auth.onAuthStateChanged(function (user) {
    if (!user) sendToLogin();
    // else: signed in, token valid, right time — page proceeds normally.
  });
})();
</script>
