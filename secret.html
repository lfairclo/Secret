<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #0b0b12; color: #f2f2f2;
    font-family: 'Courier New', monospace;
  }
  .wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center;
  }
  h1 { letter-spacing: 2px; text-shadow: 0 0 10px #ff5566; margin-bottom: 4px; }
  p.desc { color: #ccc; max-width: 480px; line-height: 1.5; }
  .card {
    background: #16161f; border: 2px solid #444; border-radius: 8px;
    padding: 28px 32px; max-width: 480px; width: 100%;
  }
  input, button {
    font-family: inherit; font-size: 15px; padding: 10px 14px;
    border-radius: 4px; border: 2px solid #666; background: #16161f; color: #f2f2f2;
  }
  input { width: 240px; text-align: center; }
  button { cursor: pointer; }
  button:hover { border-color: #ffd24d; background: #26263a; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .error { color: #ff5566; min-height: 18px; }
  .subtle { color: #888; font-size: 12px; }
</style>
</head>
<body>

<div class="wrap" id="gateTime" style="display:none;">
  <h1 style="color:#ff5566;">Sorry, unavailable at this time</h1>
  <p class="desc">Try focusing on your lesson.</p>
</div>

<div class="wrap" id="gateLogin" style="display:none;">
  <div class="card">
    <h1>SIGN IN</h1>
    <p class="desc">Sign in with your Google account to continue.</p>
    <button id="googleBtn">Sign in with Google</button>
    <p class="error" id="loginError"></p>
  </div>
</div>

<div class="wrap" id="gatePending" style="display:none;">
  <div class="card">
    <h1>WAITING FOR APPROVAL</h1>
    <p class="desc" id="pendingText"></p>
    <button id="signOutBtnPending">Sign out</button>
  </div>
</div>

<div class="wrap" id="gatePassword" style="display:none;">
  <div class="card">
    <h1>🔒 ENTER PASSWORD</h1>
    <p class="desc">Signed in as <span id="loginEmail"></span>.</p>
    <input id="passwordInput" type="password" autocomplete="off" placeholder="Password">
    <br><br>
    <button id="passwordSubmit">Enter</button>
    <p class="error" id="passwordError"></p>
    <button id="signOutBtn" style="margin-top:10px; font-size:12px;">Sign out</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   CONFIG — fill these in (same project as the snippet you
   pasted onto your other pages)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBYbJ7pLmnMs7NaTKv_ilAnKqyLjf5mjNQ",
  authDomain: "hunger-games-a73c7.firebaseapp.com",
  projectId: "hunger-games-a73c7",
  storageBucket: "hunger-games-a73c7.firebasestorage.app",
  messagingSenderId: "995321457774",
  appId: "1:995321457774:web:9ab1133dd2198665c3ca7f",
};

// SHA-256 hex hash of your password — hardcoded, no network fetch,
// so nothing here for a filter like Securly to intercept. Generate
// one in any browser console with:
//   crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourPasswordHere'))
//     .then(b => console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')));







const PASSWORD_HASH = "206dbf20db2ad0f850ba0b55ade6d78b8a583dcbd3bc559c701ff3dd6707bee4";

//ye whoever you are good luck decoding this hash. It has not only whitespace but also numbers, speciuual
//  chartrachters upercase lowercase and no actuall words






const COOKIE_NAME = 'ss_pw_token';
const VALID_MS = 60 * 60 * 1000; // 1 hour

const ALLOWED_WINDOWS = [
  [0, 8 * 60 + 45],
  [16 * 60, 24 * 60],
  [10 * 60 + 15, 10 * 60 + 35],
  [12 * 60 + 50, 14 * 60 + 5],
];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* =========================================================
   HELPERS
   ========================================================= */
function isWithinAllowedWindow(date) {
  date = date || new Date();
  const day = date.getDay();
  if (day === 0 || day === 6) return true;
  const mins = date.getHours() * 60 + date.getMinutes();
  return ALLOWED_WINDOWS.some(function (w) { return mins >= w[0] && mins < w[1]; });
}
function setPasswordToken() {
  document.cookie = COOKIE_NAME + '=' + Date.now() +
    '; max-age=' + (VALID_MS / 1000) + '; path=/; SameSite=Lax';
}
function getRedirectTarget() {
  const params = new URLSearchParams(location.search);
  return params.get('redirect') || 'https://lfairclo.github.io/Secret/hollow-school.html';
}
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}
function showOnly(id) {
  ['gateTime', 'gateLogin', 'gatePending', 'gatePassword'].forEach(function (x) {
    document.getElementById(x).style.display = (x === id) ? 'flex' : 'none';
  });
}

/* =========================================================
   FLOW: time -> Google sign-in -> approved? -> password -> redirect back
   ========================================================= */
function run() {
  if (!isWithinAllowedWindow()) {
    showOnly('gateTime');
    setTimeout(function () { if (isWithinAllowedWindow()) run(); }, 15000);
    return;
  }

  auth.onAuthStateChanged(function (user) {
    if (!user) { showOnly('gateLogin'); return; }

    const userRef = db.collection('users').doc(user.uid);
    userRef.get().then(function (doc) {
      if (!doc.exists) {
        return userRef.set({
          email: user.email,
          displayName: user.displayName || '',
          approved: false,
          requestedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () { return userRef.get(); });
      }
      return doc;
    }).then(function (doc) {
      const data = doc.data();
      if (!data || data.approved !== true) {
        document.getElementById('pendingText').textContent =
          'Your account (' + user.email + ') is waiting for approval.';
        showOnly('gatePending');
        return;
      }
      document.getElementById('loginEmail').textContent = user.email;
      showOnly('gatePassword');
    });
  });
}

document.getElementById('googleBtn').addEventListener('click', function () {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function (err) {
    document.getElementById('loginError').textContent = 'Sign-in failed: ' + err.message;
  });
});
document.getElementById('signOutBtn').addEventListener('click', function () { auth.signOut(); });
document.getElementById('signOutBtnPending').addEventListener('click', function () { auth.signOut(); });

document.getElementById('passwordSubmit').addEventListener('click', tryPassword);
document.getElementById('passwordInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') tryPassword();
});
async function tryPassword() {
  const input = document.getElementById('passwordInput');
  const errEl = document.getElementById('passwordError');
  const btn = document.getElementById('passwordSubmit');
  const candidate = input.value;
  if (!candidate) return;
  btn.disabled = true;
  const actual = await sha256Hex(candidate);
  if (actual === PASSWORD_HASH) {
    setPasswordToken();
    window.location.replace(getRedirectTarget());
  } else {
    errEl.textContent = 'Wrong password.';
    input.value = '';
    input.focus();
  }
  btn.disabled = false;
}

run();
</script>
</body>
</html>
