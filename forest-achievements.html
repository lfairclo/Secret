<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Forest — All 45 Achievements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#eef0ea; --panel:#ffffff; --panel2:#e4e8df; --border:#cfd6c8;
    --text:#1d2a22; --muted:#5d6f63; --how:#33443a; --accent:#3f7d58; --accent2:#a8741f;
    --easy:#4c9a6a; --medium:#c99a2e; --hard:#c4683a; --veryhard:#b23a48;
    --done:#e1ecdf; --doneBorder:#b5ccb3; --track:#d9dfd3; --onAccent:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#111813; --panel:#18221b; --panel2:#1f2c23; --border:#2b3a2f;
      --text:#e6ece4; --muted:#8fa294; --how:#c5d1c6; --accent:#6fbf8a; --accent2:#e0b052;
      --easy:#4caf7d; --medium:#e0b052; --hard:#e07a4d; --veryhard:#d1495b;
      --done:#1d2d22; --doneBorder:#2f4a38; --track:#0c120e; --onAccent:#0b1a10;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#111813; --panel:#18221b; --panel2:#1f2c23; --border:#2b3a2f;
    --text:#e6ece4; --muted:#8fa294; --how:#c5d1c6; --accent:#6fbf8a; --accent2:#e0b052;
    --easy:#4caf7d; --medium:#e0b052; --hard:#e07a4d; --veryhard:#d1495b;
    --done:#1d2d22; --doneBorder:#2f4a38; --track:#0c120e; --onAccent:#0b1a10;
  }
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  h1{
    font-family:'Bitter',Georgia,serif;font-weight:800;
    font-size:1.6rem;margin:0 0 4px;display:flex;align-items:center;gap:10px;
  }
  .subtitle{color:var(--muted);font-size:0.9rem;margin-bottom:16px;line-height:1.45;}

  .progress-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:16px;
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-num{font-family:'Bitter',Georgia,serif;font-size:1.3rem;font-weight:700;color:var(--accent);}
  .progress-bar-bg{height:10px;background:var(--track);border-radius:6px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .3s ease;}
  .group-progress{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.8rem;color:var(--muted);}
  .group-progress b{color:var(--text);font-weight:600;}

  #searchInput{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:8px;outline:none;font:inherit;margin-bottom:10px;
  }
  #searchInput:focus{border-color:var(--accent);}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .chip{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    padding:6px 12px;border-radius:20px;font-size:0.82rem;cursor:pointer;
    user-select:none;font:inherit;font-size:.82rem;
  }
  .chip:hover{border-color:var(--accent);}
  .chip:focus-visible,.checkbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .chip.active{background:var(--accent);color:var(--onAccent);border-color:var(--accent);font-weight:600;}
  .chip.reset{margin-left:auto;color:var(--hard);border-color:var(--hard);}

  .phase-title{
    font-family:'Bitter',Georgia,serif;font-size:1.05rem;font-weight:700;
    color:var(--accent2);margin:26px 0 2px;
  }
  .phase-note{color:var(--muted);font-size:.82rem;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);}

  .badge-item{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
    transition:background .15s,border-color .15s;
  }
  .badge-item.done{background:var(--done);border-color:var(--doneBorder);}

  .checkbox{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:transparent;padding:0;
    flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .checkbox.checked{background:var(--accent);border-color:var(--accent);}
  .checkbox svg{width:14px;height:14px;display:none;}
  .checkbox.checked svg{display:block;}

  .badge-body{flex:1;min-width:0;}
  .badge-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .order-num{font-size:0.72rem;color:var(--muted);font-weight:700;background:var(--panel2);border-radius:5px;padding:1px 6px;}
  .badge-name{font-weight:700;font-size:0.98rem;}
  .badge-desc{font-size:.8rem;color:var(--muted);font-style:italic;width:100%;}
  .badge-item.done .badge-name{color:var(--muted);text-decoration:line-through;}
  .diff-tag{font-size:0.68rem;font-weight:700;letter-spacing:0.03em;padding:2px 8px;border-radius:10px;color:#10180f;}
  .diff-Easy{background:var(--easy);}
  .diff-Medium{background:var(--medium);}
  .diff-Hard{background:var(--hard);color:#fff;}
  .diff-Very-Hard{background:var(--veryhard);color:#fff;}
  .tag{font-size:.68rem;font-weight:600;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);}

  .badge-how{font-size:0.87rem;color:var(--how);line-height:1.45;}
  .badge-item.done .badge-how{color:var(--muted);}
  .badge-note{font-size:0.78rem;color:var(--muted);margin-top:5px;line-height:1.4;}
  .empty{text-align:center;color:var(--muted);padding:35px 10px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪓 The Forest — All 45 Achievements</h1>
    <div class="subtitle">Tick them off as you go. Grouped into one-off jobs, story unlocks, out-of-the-way hunts, and full-playthrough challenges. Progress saves in this browser.</div>
  </header>

  <div class="progress-card">
    <div class="progress-top">
      <span>Progress</span>
      <span class="progress-num" id="progressNum">0 / 45</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="group-progress" id="groupProgress"></div>
  </div>

  <input id="searchInput" type="search" placeholder="Search achievements…" autocomplete="off" aria-label="Search achievements">

  <div class="controls" id="filters">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="Easy">Easy</button>
    <button class="chip" data-filter="Medium">Medium</button>
    <button class="chip" data-filter="Hard">Hard</button>
    <button class="chip" data-filter="Very Hard">Very Hard</button>
    <button class="chip" data-filter="todo">Remaining only</button>
    <button class="chip reset" id="resetBtn">Reset progress</button>
  </div>

  <div id="list"></div>
</div>

<script>
const DATA = [
{p:"One-off things to do", short:"One-offs", n:"Single actions you can knock out whenever you’re set up for them. Most take a few minutes once you have the materials."},
{name:"Boy Scout", desc:"Use the compass", diff:"Easy", how:"Pick up the compass and use it from your inventory. The quickest way is to get knocked out early on — you wake up in a cave, and a few steps in there’s a corpse with the compass (and the map) on it."},
{name:"Fisherman", desc:"Catch fish with a trap", diff:"Easy", how:"Build a rabbit/animal trap in shallow water and it turns into a fish trap. Put it somewhere with plenty of fish, like Geese Lake, and wait."},
{name:"Monster", desc:"Kill a bunny", diff:"Easy", how:"Kill a rabbit. A rabbit trap is the easiest way; otherwise sneak up slowly and use the bow or slingshot."},
{name:"Birdseye", desc:"Kill bird with arrow", diff:"Easy", how:"Build a bird house and wait for a bird to land on it, then shoot it with an arrow. Hunting shelters and cannibal bodies also attract birds."},
{name:"Splatter", desc:"Killed downed enemy with rock", diff:"Easy", how:"Knock a cannibal down until they’re on the ground wheezing, then finish them with a regular rock using a downward attack. Can be fussy — keep trying and it’ll pop."},
{name:"Minor Cannibalism", desc:"Eat an enemy", diff:"Easy", how:"Kill a cannibal, chop off an arm or leg with a sharp weapon, cook it over a fire and eat it."},
{name:"Unseen", desc:"Make and wear stealth armour", diff:"Easy", how:"Craft stealth armour from 1 lizard skin + 15 leaves, then equip it.", note:"Needs a lizard kill — don’t do this on your Vegan save."},
{name:"Handyman", desc:"Repair a shelter", diff:"Easy", how:"Craft the repair tool (2 sticks, 1 rock, 2 cloth, 10 sap). Build a hunting shelter, hit it until it’s damaged, then repair it.", note:"Building destruction must be on in gameplay settings."},
{name:"Naturopath", desc:"Craft 10 medicine items", diff:"Easy", how:"Craft herbal medicine 10 times — aloe + marigold, or aloe + marigold + coneflower for the + version. Pick up every aloe and marigold you pass."},
{name:"Longest Wall", desc:"Build a super long wall", diff:"Easy", how:"Select the custom wall blueprint and drag it out really far, then place it. You don’t need to finish building it.", note:"Defensive walls don’t seem to count — use a custom wall."},
{name:"5 Star Hotel", desc:"Sleep on yacht", diff:"Easy", how:"Find the yacht anchored off the shore, swim out to it and sleep in the bed below deck."},
{name:"Green Thumb", desc:"Grow all plant types", diff:"Medium", how:"Build a garden and grow aloe vera, coneflower and blueberry from their seeds."},
{name:"You should be looking for Timmy", desc:"Build a gazebo", diff:"Medium", how:"The gazebo blueprint is in the Decorations section of the survival book. Fairly log-heavy, so build it near a good tree line."},
{name:"Bite me!", desc:"Kill shark", diff:"Medium", how:"Sharks circle near the yacht and the outer islands. Spear one from the boat when it gets close, or throw dynamite at it."},
{name:"Demolition Expert", desc:"Knock down 6+ trees with 1 explosive", diff:"Medium", how:"Throw dynamite into a tight cluster of trees — the area around the sinkhole and Geese Lake works well."},
{name:"Commercial Fisherman", desc:"Kill 6+ fish with dynamite", diff:"Medium", how:"Throw a stick of dynamite into the middle of a fish-heavy lake like Geese Lake.", note:"Kills animals — skip on your Vegan save."},
{name:"Camp Out", desc:"Group sleep", diff:"Easy", tag:"Co-op", how:"In multiplayer, have every player vote to sleep at the same time."},
{name:"First Responder", desc:"Revive one co-op player", diff:"Easy", tag:"Co-op", how:"Revive a downed friend in multiplayer."},
{name:"Be Nice", desc:"Share a food or drink item in MP", diff:"Easy", tag:"Co-op", how:"In multiplayer you spawn with a share tin. Combine it with a food or drink item, hold it out, and let another player take it."},
{name:"Be Extremely Nice", desc:"Share a weapon in MP", diff:"Easy", tag:"Co-op", how:"Same as Be Nice, but combine the share tin with a weapon."},

{p:"Story progression", short:"Story", n:"These come naturally as you survive and push through the caves to the endgame. Grab the endgame ones while you’re in there."},
{name:"First Night", desc:"Survive 1 night", diff:"Easy", how:"Make it through your first night (sleeping is fine)."},
{name:"Survivalist", desc:"Survive 5 nights", diff:"Easy", how:"Keep going for 5 nights."},
{name:"Climate Change", desc:"Cut down 100 trees", diff:"Easy", how:"Chop 100 trees. Happens on its own once you start building a base. Counts across saves."},
{name:"Big Spender", desc:"Buy a soda and candy from vending machine", diff:"Easy", how:"In the endgame facility, after crawling through the vent you reach a cafe area with vending machines. Bring cash from the passengers/suitcases and buy from them."},
{name:"Daily Grind", desc:"Drink from coffee machine", diff:"Easy", how:"Use one of the coffee machines in the same cafe areas as the vending machines."},
{name:"Gross!", desc:"Drink from the cooler with the lawyer head", diff:"Easy", how:"Further into the facility, past a big pile of bodies, look for a projected screen with ‘HDMI’ in the corner. The water cooler with a head in it is just to the left — drink from it."},
{name:"Make It Rain", desc:"Set off sprinklers in end game", diff:"Medium", how:"Set something on fire in a facility room with working sprinklers — e.g. burn the surprise Armsy in its enclosure corridor, or set cannibals alight in the sliding-door offices. Use a flare, molotov or a lit weapon."},
{name:"Survive The Forest", desc:"Finish game", diff:"Medium", how:"Complete the story. Either ending counts."},

{p:"Out of the way", short:"Out of the way", n:"Collectibles and grinds you have to go hunting for. Several are locked to one save, so pick a main world for them."},
{name:"You are a fun guy", desc:"Eat all mushroom types", diff:"Medium", how:"Eat all 6: puffball, chanterelle, deer, liberty cap, jack and amanita. Most grow in the snowy north; amanita and deer are common in the woods. Chanterelles have a dent in the cap, jacks are smooth.", note:"Some players report it only counting if eaten in one go — if it doesn’t pop, carry them all and eat them back to back."},
{name:"Good Father", desc:"Collect all robot pieces", diff:"Medium", how:"Collect the 6 toy pieces (head, torso, both arms, both legs) from the caves, then combine them in your inventory."},
{name:"Demolition Man", desc:"Set off 20 bombs", diff:"Medium", how:"Craft bombs (booze, circuit board, wristwatch, coins, electrical tape) or use found dynamite, and set off 20 in total."},
{name:"Major Cannibalism", desc:"Eat an entire family", diff:"Medium", how:"Keep eating cannibal limbs — about a dozen arms and legs. Cook them over a fire; dried limbs may not count."},
{name:"Choppy Chop", desc:"Chop up 50 bodies", diff:"Medium", how:"Dismember 50 bodies with a sharp weapon. Do it every time you clear a cave or a raid."},
{name:"Crafty", desc:"Craft all items", diff:"Hard", how:"Craft everything in the crafting list (weapons, bags, arrows, armour, meds, bombs…). The toy and flintlock don’t count. Use a full recipe list and tick through it on one save."},
{name:"Gabe Fan", desc:"Collect all cassette tapes", diff:"Hard", how:"Find all 6 numbered cassettes (labelled ‘Cassette 1–6’ in your inventory — not the named music tapes)."},
{name:"Step Master", desc:"Pass 50,000 steps", diff:"Hard", how:"Pick up the pedometer from the Chasm cave, then just walk. It only counts while it’s in your inventory (it doesn’t need to be equipped). A big building project racks steps up fast."},
{name:"Spelunker", desc:"Explore all caves", diff:"Hard", tag:"One save", how:"Explore all 10 caves on one save: Dead, Hanging, Wet, Baby, Submerged, Lawyer’s, Chasm, Sinkhole, Ledge and Waterfall. The to-do list in the survival book shows which you’re missing."},
{name:"Serial Killer", desc:"Kill 100 cannibals", diff:"Hard", how:"Kill 100 cannibals in single player (or as the multiplayer host). Clearing caves is the fastest way."},
{name:"Medic", desc:"Revive 10 co-op players", diff:"Hard", tag:"Co-op", how:"Revive downed players 10 times in multiplayer. Reviving the same friend repeatedly counts."},
{name:"Trophy Hunter", desc:"Kill all animal types and display heads", diff:"Very Hard", how:"Craft and fill an animal head trophy for all 11: deer, rabbit, lizard, crocodile, raccoon, boar, seagull, shark, tortoise, squirrel and goose. Heads despawn quickly — mount them straight away.", note:"Shark: take the head from a dead shark washed up on the shore (heads can’t be taken from underwater kills). Goose: build a foundation over Geese Lake so the body lands somewhere you can reach it. Boars live in the snowy north."},
{name:"Get Closure", desc:"Find all missing passengers", diff:"Very Hard", tag:"One save", how:"Grab the passenger manifest from the plane, then find every passenger body on one save — names get crossed off as you go. Use a passenger location map."},
{name:"Don’t Save The Forest", desc:"Cut down 1000 trees", diff:"Very Hard", how:"Chop 1,000 trees (counts across saves). Fastest method: save by a bed next to dense trees near the sinkhole, blow them up with dynamite, reload without saving, repeat — Steam keeps the count.", note:"Console commands that destroy trees don’t count."},

{p:"Full playthrough challenges", short:"Full playthroughs", n:"Whole-run conditions. Plan a dedicated save for each — Pacifist can be folded into your Bad Father run."},
{name:"Pacifist", desc:"Don’t kill any cannibals for 10 days in a row", diff:"Medium", how:"Go 10 in-game days without killing a single cannibal. Turtle up in a defended base, start a big build, or sit somewhere quiet with supplies and let time pass. Works in co-op too.", note:"Good to grab during the Bad Father run."},
{name:"Bad Father", desc:"Survive 100 days without finding your son", diff:"Very Hard", tag:"One save", how:"Reach day 100 on one save without going into the endgame. Use the time for the long grinds — Trophy Hunter, Get Closure, Spelunker, Crafty, mushrooms."},
{name:"Vegan", desc:"Finish the game without killing or eating animals", diff:"Very Hard", tag:"One save", how:"Complete the story without killing or eating a single animal. Skip the base and live in the caves — tents to sleep, soda cans for thirst, snack bars and meds for food. Killing cannibals is fine.", note:"Anything that kills an animal ruins it: traps, dynamite, fire spreading, even an accidental arrow. Eating cannibal meat is reportedly allowed, but avoid it to be safe."},
];

const STORAGE_KEY = 'forest-achievements-progress-v1';
let state = {};
let currentFilter = 'all';

function achId(name){ return name.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(!raw){
    try{
      const c = document.cookie.split('; ').find(r => r.startsWith(STORAGE_KEY + '='));
      if(c) raw = decodeURIComponent(c.substring(STORAGE_KEY.length + 1));
    }catch(e){}
  }
  try{ state = raw ? (JSON.parse(raw) || {}) : {}; }catch(e){ state = {}; }
}

function saveState(){
  const json = JSON.stringify(state);
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
  try{ document.cookie = `${STORAGE_KEY}=${encodeURIComponent(json)}; max-age=31536000; path=/; SameSite=Lax`; }catch(e){}
}

function render(){
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  let order = 0, doneCount = 0, total = 0;
  let pendingPhase = null;
  const groups = [];

  DATA.forEach(item=>{
    if(item.p){
      pendingPhase = item;
      groups.push({name:item.short, done:0, total:0});
      return;
    }
    order++; total++;
    const g = groups[groups.length-1];
    g.total++;
    const id = achId(item.name);
    const isDone = !!state[id];
    if(isDone){ doneCount++; g.done++; }

    const searchable = `${item.name} ${item.desc} ${item.how} ${item.note||''} ${item.diff} ${item.tag||''}`.toLowerCase();
    if(query && !searchable.includes(query)) return;
    if(currentFilter === 'todo' && isDone) return;
    if(currentFilter !== 'all' && currentFilter !== 'todo' && item.diff !== currentFilter) return;

    if(pendingPhase){
      const h = document.createElement('div');
      h.innerHTML = `<h2 class="phase-title">${pendingPhase.p}</h2><p class="phase-note">${pendingPhase.n}</p>`;
      listEl.appendChild(h);
      pendingPhase = null;
    }

    const row = document.createElement('div');
    row.className = 'badge-item' + (isDone ? ' done' : '');
    row.innerHTML = `
      <button class="checkbox ${isDone ? 'checked':''}" data-id="${id}" aria-pressed="${isDone}" aria-label="Mark ${item.name} as done">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--onAccent)" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
      </button>
      <div class="badge-body">
        <div class="badge-head">
          <span class="order-num">#${order}</span>
          <span class="badge-name">${item.name}</span>
          <span class="diff-tag diff-${item.diff.replace(/\s+/g,'-')}">${item.diff}</span>
          ${item.tag ? `<span class="tag">${item.tag}</span>` : ''}
          <span class="badge-desc">${item.desc}</span>
        </div>
        <div class="badge-how">${item.how}</div>
        ${item.note ? `<div class="badge-note">${item.note}</div>` : ''}
      </div>`;
    listEl.appendChild(row);
  });

  document.getElementById('progressNum').textContent = doneCount + ' / ' + total;
  document.getElementById('progressFill').style.width = (doneCount/total*100) + '%';
  document.getElementById('groupProgress').innerHTML =
    groups.map(g=>`<span>${g.name} <b>${g.done}/${g.total}</b></span>`).join('');

  listEl.querySelectorAll('.checkbox').forEach(cb=>{
    cb.addEventListener('click', ()=>{
      state[cb.dataset.id] = !state[cb.dataset.id];
      saveState();
      render();
    });
  });

  if(!listEl.children.length){
    listEl.innerHTML = '<div class="empty">No achievements match. Clear the search or pick another filter.</div>';
  }
}

document.getElementById('filters').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip || chip.id === 'resetBtn') return;
  document.querySelectorAll('#filters .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.filter;
  render();
});

document.getElementById('searchInput').addEventListener('input', render);

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Reset all progress?')){
    state = {};
    saveState();
    render();
  }
});

loadState();
render();
</script>
</body>
</html>
