<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unavailable</title>
<style>
  html, body { margin:0; padding:0; min-height:100%; background:#0b0b12; color:#f2f2f2; font-family:'Courier New', monospace; }
  .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; text-align:center; }
  p.desc { color:#ccc; max-width:480px; line-height:1.5; }
  .subtle { color:#888; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="color:#ff5566;">Sorry, unavailable at this time</h1>
  <p class="desc">Try focusing on your lesson.</p>
  <p class="subtle">This checks the time automatically and will send you back once you're in an allowed window.</p>
</div>
<script>
const ALLOWED_WINDOWS = [
  [0, 8*60+45],
  [16*60, 24*60],
  [10*60+15, 10*60+35],
  [12*60+50, 14*60+5],
];
function isWithinAllowedWindow(date) {
  date = date || new Date();
  const day = date.getDay();
  if (day === 0 || day === 6) return true;
  const mins = date.getHours()*60 + date.getMinutes();
  return ALLOWED_WINDOWS.some(w => mins >= w[0] && mins < w[1]);
}
setInterval(function () {
  if (isWithinAllowedWindow()) window.history.back();
}, 15000);
</script>
</body>
</html>
