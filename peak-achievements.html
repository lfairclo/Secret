<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PEAK — All 64 Badges</title>
<style>
  :root{
    --bg:#12181f; --panel:#1a232d; --panel2:#20303c; --border:#2c3a47;
    --text:#e7edf3; --muted:#8ea3b3; --accent:#5ec9c9; --accent2:#e8b34d;
    --easy:#4caf7d; --medium:#e8b34d; --hard:#e07a4d; --veryhard:#d1495b;
    --done:#233028;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    padding:0;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header{margin-bottom:16px;}
  h1{
    font-size:1.5rem;margin:0 0 4px;
    display:flex;align-items:center;gap:10px;
  }
  .subtitle{color:var(--muted);font-size:0.9rem;margin-bottom:16px;}

  .progress-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:16px;
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-num{font-size:1.3rem;font-weight:700;color:var(--accent);}
  .progress-bar-bg{height:10px;background:#0e151b;border-radius:6px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .3s ease;}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    padding:6px 12px;border-radius:20px;font-size:0.82rem;cursor:pointer;
    user-select:none;transition:all .15s;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent);color:#08181a;border-color:var(--accent);font-weight:600;}
  .chip.reset{margin-left:auto;color:var(--hard);border-color:var(--hard);}

  .phase{margin-bottom:8px;}
  .phase-title{
    font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--accent2);font-weight:700;margin:22px 0 8px;
    padding-bottom:6px;border-bottom:1px solid var(--border);
  }
  .phase-title span{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px;font-size:0.75rem;}

  .badge-item{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
    transition:background .15s,border-color .15s;
  }
  .badge-item.done{background:var(--done);border-color:#2f4a3a;}
  .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .mode-buttons{display:flex;gap:6px;white-space:nowrap;}
  .mode-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    padding:8px 13px;border-radius:8px;font-weight:600;cursor:pointer;
  }
  .mode-btn:hover{border-color:var(--accent);}
  .mode-btn.active{background:var(--accent);color:#08181a;border-color:var(--accent);}
  .search-wrap{flex:1;min-width:180px;order:1;} .mode-buttons{order:2;}
  #searchInput{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:8px;outline:none;font:inherit;
  }
  #searchInput:focus{border-color:var(--accent);}
  .badge-item{position:relative;}
  .badge-cosmetic{
    flex:0 0 220px;align-self:stretch;display:flex;flex-direction:column;
    justify-content:center;border-left:1px solid var(--border);padding-left:14px;
  }
  .cosmetic-label{font-size:.65rem;letter-spacing:.08em;color:var(--accent2);font-weight:700;}
  .cosmetic-name{font-size:.82rem;color:#d8e1e8;line-height:1.35;margin-top:3px;}
  .cosmetic-row{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:14px;display:flex;align-items:center;justify-content:space-between;
    gap:16px;margin-bottom:8px;
  }
  .cosmetic-row.unlocked{background:var(--done);border-color:#2f4a3a;}
  .cosmetic-info{min-width:0;}
  .cosmetic-title{font-weight:700;font-size:.98rem;}
  .cosmetic-source{font-size:.82rem;color:var(--muted);margin-top:4px;}
  .cosmetic-status{font-size:.72rem;font-weight:700;color:var(--accent);white-space:nowrap;}
  .empty{text-align:center;color:var(--muted);padding:35px 10px;}
  @media(max-width:700px){
    .toolbar{flex-direction:column;align-items:stretch;}
    .mode-buttons{width:100%;}
    .mode-btn{flex:1;}
    .badge-cosmetic{flex-basis:145px;}
  }

  .badge-item.hidden{display:none;}

  .checkbox{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);
    flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;
  }
  .checkbox.checked{background:var(--accent);border-color:var(--accent);}
  .checkbox svg{width:14px;height:14px;display:none;}
  .checkbox.checked svg{display:block;}

  .badge-body{flex:1;min-width:0;}
  .badge-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .order-num{
    font-size:0.72rem;color:var(--muted);font-weight:700;
    background:#0e151b;border-radius:5px;padding:1px 6px;
  }
  .badge-name{font-weight:700;font-size:0.98rem;}
  .badge-item.done .badge-name{color:var(--muted);text-decoration:line-through;}
  .diff-tag{
    font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;
    padding:2px 8px;border-radius:10px;color:#08181a;
  }
  .diff-Easy{background:var(--easy);}
  .diff-Medium{background:var(--medium);}
  .diff-Hard{background:var(--hard);color:#fff;}
  .diff-Very-Hard{background:var(--veryhard);color:#fff;}

  .badge-how{font-size:0.87rem;color:#c7d3dc;line-height:1.45;}
  .badge-item.done .badge-how{color:var(--muted);}
  .badge-note{font-size:0.78rem;color:var(--muted);margin-top:4px;font-style:italic;}

  .loading{text-align:center;color:var(--muted);padding:30px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏔️ PEAK — All 64 Badges</h1>
    <div class="subtitle">Track all 64 badges, see their cosmetic rewards, or switch to Cosmetics mode to browse every unlock.</div>
  </header>

  <div class="progress-card">
    <div class="progress-top">
      <span>Progress</span>
      <span class="progress-num" id="progressNum">0 / 64</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="toolbar">
    <div class="mode-buttons">
      <button class="mode-btn active" id="achievementModeBtn">Achievements</button>
      <button class="mode-btn" id="cosmeticModeBtn">Cosmetics</button>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search achievements…" autocomplete="off">
    </div>
  </div>

  <div class="controls" id="filters">
    <div class="chip active" data-filter="all">All</div>
    <div class="chip" data-filter="Easy">Easy</div>
    <div class="chip" data-filter="Medium">Medium</div>
    <div class="chip" data-filter="Hard">Hard</div>
    <div class="chip" data-filter="Very Hard">Very Hard</div>
    <div class="chip" data-filter="todo">Remaining only</div>
    <div class="chip reset" id="resetBtn">Reset progress</div>
  </div>

  <div id="list"><div class="loading">Loading…</div></div>
</div>

<script>

const DATA = [
{p:"Natural progression — just play the route",n:"do these on your first few normal runs, no detours needed"},
{name:"Beachcomber", diff:"Easy", how:"Simply climb past the SHORE — reach and light the campfire at the top of the first biome."},
{name:"Trailblazer", diff:"Easy", how:"Climb past the TROPICS the same way — light the end-of-biome campfire."},
{name:"Arborist", diff:"Easy", how:"Reach the very top of one of the really big trees in the Tropics (or the largest boughs in Roots)."},
{name:"Nomad", diff:"Easy", how:"Climb past the MESA biome and light its campfire."},
{name:"Volcanology", diff:"Easy", how:"Climb past the CALDERA and light its campfire."},
{name:"Alpinist", diff:"Easy", how:"Climb past the ALPINE and light its campfire."},
{name:"Wanderer", diff:"Easy", how:"Climb past the GLOOM and light its campfire."},
{name:"Forestry", diff:"Easy", how:"Climb past the ROOTS and light its campfire."},
{name:"Peak", diff:"Easy", how:"Reach The Peak biome and escape the island — granted to all living players who make it out."},
{name:"Esoterica", diff:"Easy", how:"Pick up any mystical item from an Ancient Statue — granted the instant you grab one."},
{name:"Bing Bong", diff:"Easy", how:"Escape the island with Bing Bong in someone's inventory. Everyone alive gets it as long as one living player is carrying him."},
{name:"Lone Wolf", diff:"Easy", how:"Escape the island alone."},
{name:"Endurance", diff:"Easy", how:"Climb 50m straight up without ever touching solid ground. Vines work great for a clean, unbroken 50m stretch."},

{p:"Easy in-run pickups",n:"low effort, just remember to do them during a normal expedition"},
{name:"Plunderer", diff:"Easy", how:"Open 15 luggages within a single expedition. Easily done if you loot everything you pass."},
{name:"Astronomy", diff:"Easy", how:"In the MESA, pull out the Binoculars and look directly at the sun."},
{name:"Foraging", diff:"Easy", how:"Eat 5 different types of berries in one expedition (different colors/species count separately)."},
{name:"Mycology", diff:"Easy", how:"Eat 4 different non-toxic mushrooms in a single expedition (not Shroomberries — those are a separate badge)."},

{p:"Cumulative grinds",n:"tracked across multiple expeditions, just keep playing normally"},
{name:"Cooking", diff:"Easy", how:"Cook 20 total meals at campfires across any number of runs — anything cooked counts, edible or not."},
{name:"Bouldering", diff:"Easy", how:"Place 10 Pitons total across your runs."},
{name:"High Altitude", diff:"Medium", how:"Climb 5,000m total across runs (a full expedition is ~1,920m, so roughly 3 full runs)."},
{name:"Happy Camper", diff:"Easy", how:"Receive 5 total Morale Boosts from campfires. Just sit near campfires with your team when they're lit."},
{name:"Toxicology", diff:"Medium", how:"Restore 200 total Poison using items like Antidote, Cure-All, First Aid Kit, or Medicinal Root, across any number of runs."},
{name:"Calcium Intake", diff:"Hard", how:"Block 100 total damage using the Fortified Milk item, tracked across expeditions — needs repeated Milk pickups and getting hit while it's active."},

{p:"Co-op & support badges",n:"much easier in a full 4-player squad with a dedicated support role"},
{name:"First Aid", diff:"Easy", how:"Heal your teammates for 100 total Injury points in a single expedition using direct healing items (Bandages, First Aid Kit, etc.)."},
{name:"Clutch", diff:"Medium", how:"Revive 3 unconscious scouts in one expedition — reviving the same person multiple times counts each time."},

{name:"Participation", diff:"Medium", how:"Die during an expedition and have at least one teammate escape without you. Free badge on a run where things go wrong."},
{name:"Disaster Response", diff:"Hard", how:"Using the Rescue Claw, pull an unconscious friend a total of 30 meters in one pull."},
{name:"Mentorship", diff:"Medium", how:"Get Scoutmaster Myres' aggro while within 40m of him — either wander 200m+ from your team, or use the Scoutmaster's Bugle to summon him."},

{p:"Knowledge & exploration",n:"require finding specific things or playing a certain way"},
{name:"Bookworm", diff:"Medium", how:"Find and read the Scoutmaster's final journal entry. Scrolls appear randomly at campfires — some entries are tied to specific biomes, so open scrolls before passing those regions."},
{name:"Hasty", diff:"Medium", how:"Escape the island in under an hour (exactly one hour counts too). Needs a fast, efficient team run."},

{p:"Skill & action challenges",n:"specific timed or precision actions"},
{name:"Archery", diff:"Medium", how:"Remove 10 arrows from yourself in a single expedition — arrows from Citadel traps are the main source; anyone can remove them from you."},
{name:"Daredevil", diff:"Medium", how:"Get launched from the Scout Cannon across the MESA canyon and land inside the target zone."},

{name:"Ultimate", diff:"Medium", how:"Catch a Flying Disc that's been thrown at least 100m away — works even catching it out of the fog after a long throw."},

{name:"Web Security", diff:"Medium", how:"Get caught in a Spider's web and escape it alive."},
{name:"Knot Tying", diff:"Medium", how:"Place 100m of rope in a single expedition using Rope Spools, Anti-Rope Spools, or the Rope/Anti-Rope Cannons."},

{p:"Food & consumption specialty",n:"specific items or eating feats"},
{name:"Cryptogastronomy", diff:"Medium", how:"Cook a Mandrake and eat it (or have someone feed it to you)."},
{name:"Advanced Mycology", diff:"Medium", how:"Try all 5 types of Shroomberry in one expedition — take your time searching the ROOTS biome thoroughly."},
{name:"Gourmand", diff:"Hard", how:"Escape the island after cooking and eating a Half-Coconut, Honeycomb, Yellow Winterberry, and an Egg (each must be cooked at least once, even if burnt)."},
{name:"Resourcefulness", diff:"Medium", how:"Either perform cannibalism, or eat a Cooked Bird as a skeleton / with cannibalism disabled."},
{name:"Competitive Eating", diff:"Medium", how:"Eat 3 Hot Dogs within 5 seconds of each other."},
{name:"Well Rested", diff:"Medium", how:"Find and eat The Early Worm, which spawns on the ground somewhere in the GLOOM (spot is consistent per island seed)."},
{name:"Jester", diff:"Medium", how:"Open 2 Clown Luggages within a single expedition."},

{p:"Self-imposed challenge runs",n:"best tackled as a dedicated run on easy difficulty (Tenderfoot) with a coordinated team"},
{name:"Survivalist", diff:"Medium", how:"Escape the island without ever losing consciousness for any reason during the run."},
{name:"Naturalist", diff:"Medium", how:"Escape without eating any packaged food — only natural food (berries, mushrooms, cooked meals, Cure-All, etc.) is allowed."},
{name:"Balloon", diff:"Medium", how:"Escape without ever taking fall damage. Other injury sources are fine, just don't fall."},

{name:"Bundled Up", diff:"Medium", how:"Pass through the ALPINE while never exceeding 20% Cold."},
{name:"Cool Cucumber", diff:"Medium", how:"Pass through the MESA while never exceeding 10% Heat."},
{name:"Medieval History", diff:"Hard", how:"Climb past THE CITADEL without being hit by any traps — watch for arrow traps and drowsy-gas luggage traps too."},

{name:"Bellringer", diff:"Hard", how:"Ring 5 Belltowers in the GLOOM within a single expedition."},

{name:"Last Resort", diff:"Hard", how:"Use the Ritual Dagger to heal over 75% total damage at once. It's a rare item — grab it whenever it shows up and save it for a badly hurt run."},
{name:"Applied Esoterica", diff:"Very Hard", how:"Use the rare Book of Bones to resurrect a dead teammate (aim at their skeleton). Requires the item to spawn AND a teammate to die — coordinate this deliberately."},
{name:"Aeronautics", diff:"Very Hard", how:"Collect 6 total Balloons (individual or from Balloon Bunches) across a run, equip all 6 at once, and float to achieve flight."},

{p:"Endgame — save for last",n:"the true finale content, tackle once everything else is done"},
{name:"24 Karat", diff:"Very Hard", how:"In the MESA, find the Tomb entrance, complete its parkour puzzle to get the Ancient Idol, then carry it (it's heavy and slows you) all the way to the Kiln or Citadel and drop it into the lava."},
{name:"Rule Zero", diff:"Very Hard", how:"Collect the 4 amulets from Scout Statues in the first four biomes, bestow them on the Stone Scout past the Peak to transform the Strange Gem, activate Scout's Honor to teleport to Nadir, then reach the top of Nadir to trigger the true ending."},
];

const STORAGE_KEY = 'peak-badges-progress-v1';
let state = {};
let currentFilter = 'all';

function badgeId(name){ return name.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function loadState(){
  try{
    const cookie = document.cookie
      .split('; ')
      .find(row => row.startsWith(STORAGE_KEY + '='));

    if(cookie){
      const value = cookie.substring(STORAGE_KEY.length + 1);
      state = JSON.parse(decodeURIComponent(value)) || {};
    }
  }catch(e){
    console.error('cookie load failed', e);
    state = {};
  }
}

function saveState(){
  try{
    const value = encodeURIComponent(JSON.stringify(state));
    document.cookie = `${STORAGE_KEY}=${value}; max-age=31536000; path=/; SameSite=Lax`;
  }catch(e){
    console.error('cookie save failed', e);
  }
}

function render(){
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  if(currentMode === 'cosmetics'){
    renderCosmetics(listEl, query);
    return;
  }

  let order = 0;
  let doneCount = 0;
  let totalBadges = 0;

  DATA.forEach(item=>{
    if(item.p){
      // Phase headings are hidden when a search is active; they are added back
      // only when at least one badge in that phase is visible.
      return;
    }

    order++;
    totalBadges++;
    const id = badgeId(item.name);
    const isDone = !!state[id];
    if(isDone) doneCount++;

    const cosmeticText = (COSMETICS[item.name] || []).join(' ');
    const searchable = `${item.name} ${item.how} ${item.diff} ${cosmeticText}`.toLowerCase();

    if(query && !searchable.includes(query)) return;
    if(currentFilter === 'todo' && isDone) return;
    if(currentFilter !== 'all' && currentFilter !== 'todo' && item.diff !== currentFilter) return;

    const diffClass = 'diff-' + item.diff.replace(/\s+/g,'-');
    const row = document.createElement('div');
    row.className = 'badge-item' + (isDone ? ' done' : '');
    row.innerHTML = `
      <div class="checkbox ${isDone ? 'checked':''}" data-id="${id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="#08181a" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
      </div>
      <div class="badge-body">
        <div class="badge-head">
          <span class="order-num">#${order}</span>
          <span class="badge-name">${item.name}</span>
          <span class="diff-tag ${diffClass}">${item.diff}</span>
        </div>
        <div class="badge-how">${item.how}</div>
      </div>
      <div class="badge-cosmetic">
        <span class="cosmetic-label">COSMETIC</span>
        <span class="cosmetic-name">${(COSMETICS[item.name] || ['Reward cosmetic']).join(' • ')}</span>
      </div>
    `;
    listEl.appendChild(row);
  });

  document.getElementById('progressNum').textContent = doneCount + ' / ' + totalBadges;
  document.getElementById('progressFill').style.width = (doneCount/totalBadges*100) + '%';

  listEl.querySelectorAll('.checkbox').forEach(cb=>{
    cb.addEventListener('click', ()=>{
      const id = cb.dataset.id;
      state[id] = !state[id];
      saveState();
      render();
    });
  });

  if(!listEl.children.length){
    listEl.innerHTML = '<div class="empty">No achievements found.</div>';
  }
}

function renderCosmetics(listEl, query){
  const seen = new Set();
  const rows = [];

  DATA.forEach(item=>{
    if(item.p) return;
    const rewards = COSMETICS[item.name] || [];
    rewards.forEach(cosmetic=>{
      const key = cosmetic.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);

      const searchable = `${cosmetic} ${item.name} ${item.how}`.toLowerCase();
      if(query && !searchable.includes(query)) return;

      const unlocked = !!state[badgeId(item.name)];
      rows.push({cosmetic, badge:item.name, how:item.how, unlocked});
    });
  });

  rows.sort((a,b)=>a.cosmetic.localeCompare(b.cosmetic));

  rows.forEach(row=>{
    const el = document.createElement('div');
    el.className = 'cosmetic-row' + (row.unlocked ? ' unlocked' : '');
    el.innerHTML = `
      <div class="cosmetic-info">
        <div class="cosmetic-title">${row.cosmetic}</div>
        <div class="cosmetic-source">Unlocked by <strong>${row.badge}</strong> — ${row.how}</div>
      </div>
      <div class="cosmetic-status">${row.unlocked ? 'UNLOCKED' : 'LOCKED'}</div>
    `;
    listEl.appendChild(el);
  });

  if(!rows.length){
    listEl.innerHTML = '<div class="empty">No cosmetics found.</div>';
  }
}

let currentMode = 'achievements';

document.getElementById('filters').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip || chip.id === 'resetBtn' || currentMode !== 'achievements') return;
  document.querySelectorAll('#filters .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.filter;
  render();
});

document.getElementById('achievementModeBtn').addEventListener('click', ()=>{
  currentMode = 'achievements';
  document.getElementById('achievementModeBtn').classList.add('active');
  document.getElementById('cosmeticModeBtn').classList.remove('active');
  document.getElementById('searchInput').placeholder = 'Search achievements…';
  document.getElementById('filters').style.display = 'flex';
  document.querySelector('.progress-card').style.display = '';
  render();
});

document.getElementById('cosmeticModeBtn').addEventListener('click', ()=>{
  currentMode = 'cosmetics';
  document.getElementById('cosmeticModeBtn').classList.add('active');
  document.getElementById('achievementModeBtn').classList.remove('active');
  document.getElementById('searchInput').placeholder = 'Search cosmetics…';
  document.getElementById('filters').style.display = 'none';
  document.querySelector('.progress-card').style.display = 'none';
  render();
});

document.getElementById('searchInput').addEventListener('input', render);

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(confirm('Reset all progress?')){
    state = {};
    saveState();
    render();
  }
});

(async ()=>{
  loadState();
  render();
})();
</script>
</body>
</html>
